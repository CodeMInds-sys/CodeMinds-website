.sr-only {

}

.pb-step:hover {
  transform: scaleY(1.5);
  background: var(--cm-border-strong);
}

.pb-step.active {
  background: var(--cm-green);

}

.pb-step.done {

.chapter-label {

  background: var(--cm-green-soft);

.slide {

.tag-grid {

.quiz-section {

.quiz-opt:hover {

.quiz-opt:focus-visible {

.quiz-opt.correct {

.quiz-feedback.wrong {

.nav-btn {

  border: 1px solid var(--cm-border-strong);
  border-radius: var(--cm-radius-sm);

  font-weight: 600;

.nav-btn:hover:not(:disabled) {

.nav-btn:active:not(:disabled) {

.nav-btn:disabled {

}

.step-counter {

  font-size: 12px;
  font-weight: 600;

}

.try-label {

.try-input {

  color: var(--cm-green);

let current = 0;
let answered = {};

function buildSlides(){
  const container = document.getElementById('slides');
  slides.forEach((s,i)=>{
    const div = document.createElement('div');
    div.className = 'slide' + (i===0?' active':'');
    div.id = 'slide-'+i;
    let qHtml = '';
    if(s.quiz){
      qHtml = `<div class="quiz-section">
<p class="quiz-q">🧠 ${s.quiz.q}</p>
<div class="quiz-opts" id="opts-${i}">
${s.quiz.opts.map((o,oi)=>`<button class="quiz-opt" onclick="answer(${i},${oi})">${o}</button>`).join('')}
</div>
<div id="fb-${i}" class="quiz-feedback" style="display:none"></div>
</div>`;
    }
    div.innerHTML = `<div class="slide-title">${s.title}</div>${s.content}${qHtml}`;
    container.appendChild(div);
  });
}

function buildProgress(){
  const bar = document.getElementById('pbar');
  slides.forEach((s,i)=>{
    const d = document.createElement('div');
    d.className = 'pb-step' + (i===0?' active':'');
    d.id='pb-'+i;
    d.title = s.title;
    d.onclick=()=>goTo(i);
    bar.appendChild(d);
  });
}

function answer(slideIdx, optIdx){
  if(answered[slideIdx] !== undefined) return;
  answered[slideIdx] = optIdx;
  const quiz = slides[slideIdx].quiz;
  const opts = document.querySelectorAll(`#opts-${slideIdx} .quiz-opt`);
  const fb = document.getElementById('fb-'+slideIdx);
  opts.forEach((o,i)=>{
    o.style.cursor='default';
    if(i===quiz.correct) o.classList.add('correct');
    else if(i===optIdx && optIdx!==quiz.correct) o.classList.add('wrong');
  });
  const correct = optIdx === quiz.correct;
  fb.style.display='block';
  fb.className='quiz-feedback '+(correct?'correct':'wrong');
  fb.textContent = (correct?'✅ صح! ':'❌ مش صح — ') + quiz.explain;
}

function goTo(n){
  document.querySelector('.slide.active').classList.remove('active');
  document.getElementById('pb-'+current).classList.remove('active');
  if(answered[current]!==undefined || !slides[current].quiz){
    document.getElementById('pb-'+current).classList.add('done');
  }
  current=n;
  document.getElementById('slide-'+current).classList.add('active');
  document.getElementById('pb-'+current).classList.remove('done');
  document.getElementById('pb-'+current).classList.add('active');
  document.getElementById('chapterLabel').textContent = slides[current].chapter;
  document.getElementById('stepCounter').textContent = (current+1) + ' / ' + slides.length;
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===slides.length-1;
}

function navigate(dir){
  const n = current+dir;
  if(n>=0 && n<slides.length) goTo(n);
}

buildSlides();
buildProgress();
document.getElementById('chapterLabel').textContent = slides[0].chapter;
document.getElementById('stepCounter').textContent = '1 / '+slides.length;
document.getElementById('prevBtn').disabled = true;
</script>
